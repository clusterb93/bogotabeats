<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BogotaBeats — DJ</title>
  <meta name="description" content="BogotaBeats — DJ · Tribal House, Latin Club, Latin Tech & Neo Perreo. Sets, tour dates, EPK & booking.">
  <link rel="canonical" href="https://bogotabeats.com/">
  <meta property="og:url" content="https://bogotabeats.com/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BogotaBeats — DJ">
  <meta property="og:description" content="Tribal House · Latin Club · Latin Tech · Neo Perreo">
  <meta property="og:image" content="https://lh3.googleusercontent.com/d/1Yn15aRdrcnhO2Bn518u8Lq8_gZlwmLv8=w1200">
  <meta name="theme-color" content="#07050b">
  <!-- Google Drive refuse les images si le site envoie un referrer : on le coupe globalement (les iframes YouTube le réactivent) -->
  <meta name="referrer" content="no-referrer">
  <!-- Favicon : logo foncé (BogotaBeats_logo.png du Drive), lisible sur les onglets clairs -->
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1Bc1BUIX8T7BkPSXet3y_-ufYFmG_TFOl=w64">
  <script>
    // Thème appliqué avant l'affichage (évite le flash) : ?theme= > choix mémorisé > Rave par défaut
    (function () {
      var q = new URLSearchParams(location.search).get('theme'), s = null;
      try { s = localStorage.getItem('theme'); } catch (e) {}
      var t = q || s || 'dark';
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Feuille de Monstera (thème Jungle) : cœur fendu + perforations, découpées par un masque -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="monstera-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="230">
      <rect width="200" height="230" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="7" stroke-linecap="round">
        <!-- fentes côté gauche, de la nervure vers le bord -->
        <path d="M82 42 Q58 33 28 36"/>
        <path d="M77 66 Q46 57 4 63"/>
        <path d="M75 92 Q40 86 -4 98"/>
        <path d="M75 118 Q40 116 -4 134"/>
        <path d="M78 143 Q50 148 6 176"/>
        <path d="M84 163 Q66 178 38 206"/>
        <!-- fentes côté droit (miroir) -->
        <path d="M118 42 Q142 33 172 36"/>
        <path d="M123 66 Q154 57 196 63"/>
        <path d="M125 92 Q160 86 204 98"/>
        <path d="M125 118 Q160 116 204 134"/>
        <path d="M122 143 Q150 148 194 176"/>
        <path d="M116 163 Q134 178 162 206"/>
      </g>
      <g fill="#000">
        <!-- perforations le long de la nervure -->
        <ellipse cx="88" cy="54" rx="3.5" ry="7" transform="rotate(-18 88 54)"/>
        <ellipse cx="86" cy="79" rx="4" ry="8" transform="rotate(-12 86 79)"/>
        <ellipse cx="86" cy="105" rx="4" ry="8" transform="rotate(-8 86 105)"/>
        <ellipse cx="88" cy="130" rx="3.5" ry="7" transform="rotate(-4 88 130)"/>
        <ellipse cx="112" cy="54" rx="3.5" ry="7" transform="rotate(18 112 54)"/>
        <ellipse cx="114" cy="79" rx="4" ry="8" transform="rotate(12 114 79)"/>
        <ellipse cx="114" cy="105" rx="4" ry="8" transform="rotate(8 114 105)"/>
        <ellipse cx="112" cy="130" rx="3.5" ry="7" transform="rotate(4 112 130)"/>
      </g>
    </mask>
  </defs>
  <symbol id="monstera" viewBox="0 0 200 230">
    <!-- tige -->
    <path d="M100 176 C101 196 104 212 110 229" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
    <!-- limbe en cœur, échancrure à la base, pointe en haut -->
    <path mask="url(#monstera-cut)" fill="currentColor" d="M100 178 C78 198 22 196 10 146 C-2 92 38 24 100 8 C162 24 202 92 190 146 C178 196 122 198 100 178 Z"/>
    <!-- nervure centrale et nervures secondaires, en clair -->
    <g mask="url(#monstera-cut)" fill="none" stroke="#fff" stroke-opacity=".22" stroke-linecap="round">
      <path d="M100 176 L100 14" stroke-width="2.5"/>
      <path d="M100 30 Q80 28 60 40 M100 54 Q76 50 50 58 M100 80 Q72 76 36 84 M100 106 Q70 104 28 114 M100 132 Q72 134 32 150 M100 156 Q80 164 56 184" stroke-width="1.2"/>
      <path d="M100 30 Q120 28 140 40 M100 54 Q124 50 150 58 M100 80 Q128 76 164 84 M100 106 Q130 104 172 114 M100 132 Q128 134 168 150 M100 156 Q120 164 144 184" stroke-width="1.2"/>
    </g>
  </symbol>
</svg>

<header class="nav" id="nav">
  <a href="#home" class="nav__logo" aria-label="BogotaBeats — home"><img id="navLogo" alt="BogotaBeats"></a>
  <button class="nav__burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
  <nav class="nav__links" id="navLinks">
    <!-- Liens du menu : générés par le moteur depuis site.json → sections -->
    <div class="nav__tools">
      <div class="langs" id="langs" role="group" aria-label="Language"></div>
      <div class="themes-wrap">
        <div class="themes" id="themes" role="radiogroup"></div>
        <div class="theme-hint" id="themeHint" hidden>
          <span id="themeHintText"></span>
          <button type="button" id="themeHintClose" aria-label="Close">×</button>
        </div>
      </div>
    </div>
  </nav>
</header>

<!-- Sections : construites par le moteur (engine/) selon site.json → sections -->
<main></main>

<footer class="footer">
  <div class="tricolor"></div>
  <p>BogotaBeats © <span id="year"></span> · <span data-i18n="footer.base"></span></p>
  <p class="footer__sync" id="syncInfo"></p>
  <p class="footer__sync"><button type="button" class="footer__consent" id="consentManage" data-i18n="consent.manage" hidden>Cookies</button></p>
</footer>

<!-- Bandeau de consentement Google Analytics (affiché seulement si site.json → analytics.ga4 est rempli) -->
<div class="consent" id="consent" role="dialog" aria-live="polite" aria-labelledby="consentText" hidden>
  <p id="consentText" data-i18n="consent.text"></p>
  <div class="consent__actions">
    <button type="button" class="btn btn--ghost btn--sm" data-consent="denied" data-i18n="consent.refuse">Refuse</button>
    <button type="button" class="btn btn--accent btn--sm" data-consent="granted" data-i18n="consent.accept">Accept</button>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" id="lbClose" aria-label="Close">×</button>
  <button class="lightbox__nav lightbox__prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="lightbox__nav lightbox__next" id="lbNext" aria-label="Next">›</button>
  <a class="btn btn--accent btn--sm lightbox__dl" id="lbDl" target="_blank" rel="noopener" data-i18n="epk.dlHd">Download HD</a>
</div>

<script src="engine/app.js" type="module"></script>
</body>
</html>
